name: Deploy to Staging

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'website/**'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="key=staging/terraform.tfstate"
      - run: terraform plan -var-file="staging.tfvars"
      - run: terraform apply -auto-approve -var-file="staging.tfvars"